ть международную медицинскую страховку`,`Подать документы в консульство или визовый центр на долгосрочную студенческую визу типа D`,`Прибыть в кампус на неделю ориентации (Orientation Week)`]}],Rt=[{id:`dsu`,country:`Италия 🇮🇹`,name:`Стипендия DSU (Diritto allo Studio Universitario)`,amount:`100% бесплатная учеба + бесплатное общежитие + до 7 500 € в год наличными`,description:`Государственная социальная стипендия, доступная иностранным студентам на основе финансового положения семьи (расчет ISEE Parificato). Один из самых щедрых грантов в мире!`,requirements:`Справка о составе семьи, справка о доходах родителей за предыдущий год и свидетельство о недвижимости.`,deadline:`Конец августа – начало сентября ежегодно`},{id:`daad`,country:`Германия 🇩🇪`,name:`Стипендии DAAD (Германская служба академических обменов)`,amount:`934 € в месяц для магистратуры + медицинская страховка + перелет`,description:`Крупнейшая в мире организация по финансированию студентов. Программы DAAD охватывают все специальности от инженерии до искусства.`,requirements:`Высокий академический балл (GPA от 4.5/5.0), сильная мотивация, рекомендации профессоров.`,deadline:`Октябрь – ноябрь за год до начала обучения`},{id:`eiffel`,country:`Франция 🇫🇷`,name:`Стипендия превосходства Eiffel (Eiffel Excellence)`,amount:`1 181 € в месяц (магистратура) / 1 700 € (аспирантура) + билеты`,description:`Программа Министерства Европы и иностранных дел Франции для привлечения лучших зарубежных талантов в магистратуру и аспирантуру.`,requirements:`Подача осуществляется исключительно через французский университет после предварительного отбора.`,deadline:`Ноябрь – январь ежегодно`},{id:`si`,country:`Швеция 🇸🇪`,name:`Swedish Institute Scholarships for Global Professionals (SI)`,amount:`100% покрытия стоимости обучения + 12 000 SEK (~1 050 €/мес) на жизнь`,description:`Государственная стипендия правительства Швеции для амбициозных лидеров и магистров в области устойчивого развития и инноваций.`,requirements:`Подтвержденный опыт работы/волонтерства от 3 000 часов, лидерские качества.`,deadline:`Февраль ежегодно`},{id:`holland`,country:`Нидерланды 🇳🇱`,name:`NL Scholarship (ранее Holland Scholarship)`,amount:`5 000 € единоразовый грант на первый год учебы`,description:`Финансируется Министерством образования, культуры и науки Нидерландов для студентов из стран, не входящих в ЕЭЗ.`,requirements:`Подача заявления о приеме в один из нидерландских исследовательских университетов (UvA, TU Delft и др.).`,deadline:`1 февраля или 1 мая в зависимости от университета`}],zt=[{q:`Правда ли, что в государственных университетах Германии, Чехии и Словакии учеба бесплатная?`,a:`Да! В Германии в 15 из 16 федеральных земель (кроме Баден-Вюртемберга) обучение в государственных университетах стоит 0 €, студенты платят только семестровый взнос 150–350 €, куда входит бесплатный проездной. В Чехии и Словакии обучение на 100% бесплатно для всех иностранцев при условии выбора программ на национальном языке (чешском или словацком).`},{q:`Что делать выпускнику 11 классов: можно ли поступить в Европу сразу после школы?`,a:`В ряде стран (Франция, Италия, Польша, Нидерланды на ряд программ) поступить можно напрямую с 11 классами. В Германии и Австрии школьное образование длится 12–13 лет, поэтому абитуриентам требуется либо 1 год отучиться в Studienkolleg (подготовительном колледже), либо закончить 1 курс университета на родине, после чего можно сразу переводиться на бакалавриат.`},{q:`Сколько часов в неделю студентам разрешено официально подрабатывать?`,a:`Студенческая виза во всех странах ЕС дает законное право на работу. В Германии разрешено работать 140 полных или 280 неполных дней в году (около 20 часов в неделю). Во Франции, Испании и Австрии также действует лимит до 20 часов в неделю во время семестра и полный день на каникулах. Средняя зарплата студента составляет 12–15 € в час.`},{q:`Что такое субсидия CAF во Франции и сколько денег она возвращает?`,a:`CAF (Caisse d'Allocations Familiales) — государственная социальная помощь на аренду жилья во Франции. Доступна абсолютно всем студентам, включая иностранцев. В зависимости от типа жилья и города CAF возвращает от 120 до 250 € ежемесячно прямо на ваш счет, покрывая до 35–40% арендной платы.`},{q:`Что такое блокированный счет (Sperrkonto) в Германии?`,a:`Это специальный банковский счет для подтверждения финансовой состоятельности для студенческой визы в Германию (на 2026/2027 год сумма составляет около 11 904 €). С этого счета после приезда в Германию вам ежемесячно разблокируется равная часть (~992 €) на проживание, еду и аренду. Если у вас есть подтвержденная стипендия DAAD, блокированный счет не требуется.`},{q:`Нужен ли сертификат IELTS, если я хочу учиться в Европе?`,a:`Для программ на английском языке большинство университетов просят IELTS от 6.0 до 7.0 или TOEFL iBT от 80 до 100. Однако, если вы поступаете на программы с изучением национального языка (в Чехии, Словакии, Австрии, Италии), английский экзамен не требуется: вы можете пройти языковой подготовительный год и сдать внутренний экзамен ВУЗа.`}];function Bt({onBack:e,onNavigateToCatalog:t}){let[n,r]=(0,_.useState)(`roadmap`),[i,a]=(0,_.useState)(0);return(0,k.jsxs)(`div`,{className:`min-h-screen py-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-left animate-fadeIn`,children:[(0,k.jsxs)(`div`,{className:`flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 pb-5 border-b border-[#8B0000]/15`,children:[(0,k.jsxs)(`button`,{onClick:e,className:`inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#8B0000]/10 hover:bg-[#8B0000]/15 text-[#8B0000] text-xs sm:text-sm font-bold transition-all border border-[#8B0000]/20`,children:[(0,k.jsx)(ce,{className:`w-4 h-4`}),(0,k.jsx)(`span`,{children:`На главную`})]}),(0,k.jsxs)(`div`,{className:`text-left sm:text-right`,children:[(0,k.jsx)(`span`,{className:`text-xs font-bold uppercase tracking-wider text-[#8B0000]/80 block`,children:`База знаний абитуриента`}),(0,k.jsx)(`span`,{className:`text-
